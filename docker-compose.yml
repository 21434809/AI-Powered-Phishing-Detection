version: '3.9'
services:
  backend:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: backend
    environment:
      - FLASK_DEBUG=0
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: phishing-detection-frontend/Dockerfile
    container_name: frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped