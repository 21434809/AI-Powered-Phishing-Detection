version: '3.9'
services:
  backend:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: backend
    environment:
      - FLASK_DEBUG=0
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/api/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: phishing-detection-frontend/Dockerfile
    container_name: frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped